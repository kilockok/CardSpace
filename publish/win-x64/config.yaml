# === 窗口配置 ===
window:
  width: 960
  height: 680
  can_resize: false
  title: "个人主页"

# === 风格配置 ===
# fluent: Windows 风格，支持亮/暗主题
# glass: 液态玻璃风格，固定暗色
style: fluent

# === 主题（仅 fluent 生效）===
theme: black

# === 布局配置（Fluent 风格） ===
layout:
  columns: "300,*"
  rows: "*,210"
  column_spacing: 16
  row_spacing: 16
  margin: "20,8,20,20"

# === 布局配置（Glass 风格覆写） ===
layout_glass:
  columns: "300,*"
  rows: "*,200"
  column_spacing: 24
  row_spacing: 24
  margin: "24"

# === 个人信息 ===
profile:
  name: "Kilock"
  id: "@kilock_1208"
  signature: "清凤凤凤凤凤!"
  tags:
    - "Dev"
    - "INTP"
    - "Mtx"
  # 图片路径（相对于 exe 所在目录，或绝对路径）
  # 默认位于 exe 同级的 Assets 文件夹下
  # 可自行替换图片文件，保持文件名一致即可
  #   - Assets/cover.jpg   封面背景图
  #   - Assets/avatar.png  头像图片
  cover_image: "Assets/cover.jpg"
  avatar_image: "Assets/avatar.png"

# === 地理位置 ===
location:
  city: "浙江 · 宁波"
  description: "qwqwqwq!"
  # 地图图片路径
  #   - Assets/map.png    地图图片
  map_image: "Assets/map.png"

# === 社交链接 ===
social:
  x: "https://x.com/kilock_1208"
  github: "https://github.com/kilockok"

# === 技术栈 ===
tech_stack:
  - name: "C++"
    icon: "CppIcon"
    color: "#00599C"
  - name: "Python"
    icon: "PythonIcon"
    color: "#3776AB"
  - name: "HTML5"
    icon: "Html5Icon"
    color: "#E34F26"
  - name: "Vue"
    icon: "VueIcon"
    color: "#42B883"
  - name: "Node.js"
    icon: "NodeJsIcon"
    color: "#339933"
  - name: "Docker"
    icon: "DockerIcon"
    color: "#2496ED"

# === 链接 ===
links:
  - icon: "GitHubIcon"
    text: "github.com/kilockok"
  - icon: "BlogIcon"
    text: "清凤.fun"

# === 理念 ===
philosophy:
  title: "Our Philosophy"
  quotes:
    - "活下去，去做更多、更优秀的作品"
  attribution: "以及陪着清凤"

# === 组件声明 ===
# 每个组件对应一个预定义模板，通过 type 引用
# 支持 Grid 布局参数、可见性、z-index、元素属性覆写
components:
  - name: "profile_card"
    type: "profile_card"
    grid_row: 0
    grid_column: 0
    grid_row_span: 2
    grid_column_span: 1
    visible: true
    z_index: 0
    overrides:
      name_text:
        font_size: 22
        font_weight: "SemiBold"
      id_text:
        font_size: 13
      signature_text:
        font_size: 13
        font_style: "Italic"

  - name: "map_card"
    type: "map_card"
    grid_row: 0
    grid_column: 1
    visible: true
    z_index: 0

  - name: "tech_card"
    type: "tech_stack_card"
    grid_row: 1
    grid_column: 1
    visible: true
    z_index: 0
    sub_columns: "*,*"
    sub_column_spacing: 16
    sub_column: 0

  - name: "philosophy_card"
    type: "philosophy_card"
    grid_row: 1
    grid_column: 1
    visible: true
    z_index: 0
    sub_column: 1
